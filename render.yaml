services:
  - type: web
    name: cm-training-api
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      # Required — add values in Render Dashboard → Environment (app won't start without them)
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_AUDIENCE
        sync: false
      - key: DATABASE_URL
        sync: false
      # Optional — must match Auth0 Action custom claim for roles on access token
      - key: AUTH0_ROLES_CLAIM
        sync: false
      # Optional — Contentful Content Delivery / Preview API
      - key: CONTENTFUL_SPACE_ID
        sync: false
      - key: CONTENTFUL_ACCESS_TOKEN
        sync: false
      - key: CONTENTFUL_ENVIRONMENT
        sync: false
      - key: CONTENTFUL_PREVIEW_ACCESS_TOKEN
        sync: false
